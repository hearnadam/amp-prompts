name: Regenerate prompts on amp bump

on:
  pull_request:
    paths:
      - package.json
      - bun.lock
      - .github/workflows/regenerate-prompts.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    if: contains(github.event.pull_request.labels.*.name, 'amp-bump') || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run extract

      - name: Commit regenerated prompts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A prompts amp-prompts.md
          if git diff --cached --quiet; then
            echo "No prompt changes."
            exit 0
          fi
          AMP_VERSION=$(node -p "require('./node_modules/@sourcegraph/amp/package.json').version")
          git commit -m "Regenerate prompts for @sourcegraph/amp@${AMP_VERSION}"
          git push

      - name: Auto-approve and enable auto-merge (Dependabot only)
        if: github.actor == 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review "$PR_URL" --approve --body "Auto-approved: prompts regenerated."
          gh pr merge "$PR_URL" --auto --squash
